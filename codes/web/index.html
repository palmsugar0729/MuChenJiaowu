<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：让 iPhone 刘海机型能配合 env(safe-area-inset-*) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>沐晨课程管理</title>
    <!-- 图标：assets/design/02_book.svg 的副本（放在 public/favicon.svg，构建时原样拷进 dist） -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS「添加到主屏幕」不认 SVG，用同一张图渲出来的 180px PNG -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 手机上地址栏 / 状态栏跟着品牌色走 -->
    <meta name="theme-color" content="#a9c5b3" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
